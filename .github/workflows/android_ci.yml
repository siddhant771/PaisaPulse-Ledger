name: FinSecure CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build and Test
        run: ./gradlew assembleDebug test
        env:
          ORG_GRADLE_PROJECT_GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
          # This maps the GitHub Secret to a Gradle Property
