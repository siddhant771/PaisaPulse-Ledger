services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paisapulse_backend_api
    ports:
      - "8000:8000"
    env_file:
      - .env  # Changed from ./backend/.env to .env  # This must point to the .env inside the backend folder
    volumes:
      - ./backend:/app
    environment:
      - ENV=development
    restart: unless-stopped