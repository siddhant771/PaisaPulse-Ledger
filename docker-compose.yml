services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: paisapulse_backend_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENV: development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
